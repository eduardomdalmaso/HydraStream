name: Release HydraStream Binaries

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip dpkg-dev binutils

      - name: Run Tests
        run: |
          make test

      - name: Build Distribution Packages (Linux .deb & Windows .zip)
        run: |
          make package-all

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.zip
            bin/hydrastream.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
