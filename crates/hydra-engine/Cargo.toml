[package]
name = "hydra-engine"
version = "0.1.0"
edition = "2021"
authors = ["HydraStream Core Team"]
description = "Zero-copy POSIX shared memory video ring buffer & FPS governor engine"

[lib]
name = "hydra_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hydra-engine"
path = "src/main.rs"

[dependencies]
libc = "0.2"
memmap2 = "0.9"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
